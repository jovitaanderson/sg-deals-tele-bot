name: Check Singapore Deals

on:
  schedule:
    # 00:00 UTC = 08:00 Singapore time (SGT is UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deals checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check_deals.py

      - name: Commit updated seen-list and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.sqlite3 report.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update seen deals and report [skip ci]"
            git push
          fi

name: Check Singapore Deals

on:
  schedule:
    # 00:00 UTC = 08:00 Singapore time (SGT is UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Send a fixed Telegram test message instead of checking feeds (use this to confirm Telegram is wired up)"
        type: boolean
        default: false
      notify_even_if_empty:
        description: "Always send a Telegram message, even if no new deals were found (used by /check)"
        type: boolean
        default: false
      full_check:
        description: "Ignore the dedup store and report every currently-matching deal, seen or not (used by /full)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deals checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SEND_TEST_PING: ${{ github.event.inputs.send_test_message }}
          ALWAYS_NOTIFY: ${{ github.event.inputs.notify_even_if_empty }}
          FULL_CHECK: ${{ github.event.inputs.full_check }}
        run: python3 check_deals.py

      - name: Commit updated seen-list and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.sqlite3 report.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update seen deals and report [skip ci]"
            git push
          fi
